<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Django App{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'myapp/css/main.css' %}">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="{% url 'home' %}" class="navbar-logo">MySite</a>

            <ul class="navbar-menu">
                <li class="navbar-item">
                    <a href="{% url 'home' %}" class="navbar-link">Home</a>
                </li>
                <li class="navbar-item">
                    <a href="{% url 'about' %}" class="navbar-link">About</a>
                </li>
                <li class="navbar-item">
                    <a href="{% url 'contact' %}" class="navbar-link">Contact</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p class="footer-text">© 2026 MySite. All rights reserved.</p>
    </footer>

</body>
</html>
