{% extends "base.html" %}
{% load static %}

{% block content %}
<h1>Produkty</h1>

<div class="product-grid">
    {% for item in items %}
        <div class="product-card">
            <a href="{% url 'item_detail' item.slug %}">
                <img src="{{ item.image.url }}" alt="{{ item.name }}">
                <h3>{{ item.name }}</h3>
                <p>{{ item.price }} €</p>
            </a>
        </div>
    {% endfor %}
</div>
{% endblock %}
